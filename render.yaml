services:
  - type: web
    name: parez
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAREZ_DATA_DIR
        value: /app/data
    disk:
      name: parez-data
      mountPath: /app/data
      sizeGB: 1