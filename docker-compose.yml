version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parez-app
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/parez.db
      - COOKIE_SECURE=1
      - SESSION_TTL_HOURS=24
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:4177:4177"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4177/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - parez-network

  nginx:
    image: nginx:alpine
    container_name: parez-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - parez-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: parez-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"

networks:
  parez-network:
    driver: bridge

volumes:
  certbot-conf:
  certbot-www: